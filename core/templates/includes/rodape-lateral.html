<div class="frase-lateral">
    <h3 aria-hidden="true"><svg class="timeline-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg></h3>
    <h4>No seu ritmo.</h4>
    <p>Pequenos passos tamb&#233;m fazem o dia avan&#231;ar.</p>
</div>
<div class="usuario">
    {% if user.is_authenticated %}
        <strong>{{ user.username }}</strong>
        <p>Conta conectada</p>
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Sair da conta</button>
        </form>
    {% else %}
        <strong>Visitante</strong>
        <p>N&#227;o conectado</p>
        <a href="{% url 'login' %}">Entrar</a>
    {% endif %}
</div>
